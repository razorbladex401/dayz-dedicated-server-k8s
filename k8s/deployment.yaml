---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dayz
  namespace: dayz
  labels:
    app: dayz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dayz
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dayz
    spec:
      volumes:
        - name: dayz-data
          persistentVolumeClaim:
            claimName: dayz-data-pvc
        - name: dayz-profile
          persistentVolumeClaim:
            claimName: dayz-profile-pvc
        - name: dayz-server-cfg
          configMap:
            name: dayz-server-cfg
            items:
            - key: serverDZ.cfg
              path: serverDZ.cfg
        - name: dayz-beserver-cfg
          configMap:
            name: dayz-beserver-cfg
            items:
            - key: BEServer_x64.cfg
              path: BEServer_x64.cfg
        - name: dayz-beserver-generated
          emptyDir: {}
        - name: filebrowser-config
          persistentVolumeClaim:
            claimName: filebrowser-config-pvc
      initContainers:
        - name: render-beserver-cfg
          image: python:3.12-alpine
          imagePullPolicy: IfNotPresent
          command:
            - python
            - -c
            - |
              from pathlib import Path
              import os

              template = Path('/template/BEServer_x64.cfg').read_text()
              password = os.environ['RCON_PASSWORD']
              Path('/work/BEServer_x64.cfg').write_text(template.replace('__RCON_PASSWORD__', password))
          env:
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dayz-rcon
                  key: RCON_PASSWORD
          volumeMounts:
            - name: dayz-beserver-cfg
              mountPath: /template
              readOnly: true
            - name: dayz-beserver-generated
              mountPath: /work
      containers:
        - name: dayz
          image: razorbladex401/dayz:latest
          imagePullPolicy: Always
          volumeMounts:
          - mountPath: "/home/steam/dayz"
            name: dayz-data
          - mountPath: "/home/steam/profile"
            name: dayz-profile
          - name: dayz-server-cfg
            mountPath: "/home/steam/serverDZ.cfg"
            subPath: serverDZ.cfg
          - name: dayz-beserver-generated
            mountPath: "/home/steam/battleye"
          env:
            - name: GAME
              value: dayz
            - name: HOME
              value: /home/steam
            - name: APPID
              value: "223350"
            - name: TZ
              value: "America/New_York"
            - name: STEAMACCOUNT
              valueFrom:
                secretKeyRef:
                  name: steamaccount
                  key: STEAMACCOUNT
            - name: STEAMPASSWORD
              valueFrom:
                secretKeyRef:
                  name: steamaccount
                  key: STEAMPASSWORD
            - name: CPUCOUNT
              value: "4"
            - name: PORT
              value: "2302"
          ports:
            - name: rcon
              containerPort: 2310
            - name: steam-27016
              containerPort: 27016
            - name: steam-8766
              containerPort: 8766
            - name: game-2305
              containerPort: 2305
            - name: game-2304
              containerPort: 2304
            - name: game-2303
              containerPort: 2303
            - name: game-2302
              containerPort: 2302
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              exec filebrowser \
                --address 0.0.0.0 \
                --port 8080 \
                --root /srv \
                --database /config/filebrowser.db \
                --noauth
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
          - mountPath: /srv/dayz
            name: dayz-data
          - mountPath: /srv/profile
            name: dayz-profile
          - mountPath: /config
            name: filebrowser-config
          ports:
            - name: filebrowser
              containerPort: 8080
        - name: dayz-status
          image: razorbladex401/dayz-status:latest
          imagePullPolicy: Always
          env:
            - name: RCON_HOST
              value: 127.0.0.1
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: RCON_PORT
              value: "2310"
            - name: RCON_TIMEOUT
              value: "1.5"
            - name: RCON_TRANSPORT
              value: auto
            - name: BERCON_ENABLE
              value: "true"
            - name: BERCON_BIN
              value: /usr/local/bin/bercon-cli
            - name: STATUS_LOG_LEVEL
              value: INFO
            - name: MODLIST
              value: ""
            - name: RCON_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: dayz-rcon
                  key: RCON_PASSWORD
          volumeMounts:
          - mountPath: /srv/dayz
            name: dayz-data
            readOnly: true
          - mountPath: /srv/profile
            name: dayz-profile
            readOnly: true
          - mountPath: /config/serverDZ.cfg
            name: dayz-server-cfg
            subPath: serverDZ.cfg
            readOnly: true
          - mountPath: /battleye
            name: dayz-beserver-generated
            readOnly: true
          ports:
            - name: status
              containerPort: 8090

