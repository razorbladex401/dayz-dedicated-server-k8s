---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dayz
  namespace: dayz
  labels:
    app: dayz
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dayz
  strategy:
    type: RollingUpdate
  template:
    metadata:
      labels:
        app: dayz
    spec:
      volumes:
        - name: dayz-data
          persistentVolumeClaim:
            claimName: dayz-data-pvc
        - name: dayz-profile
          persistentVolumeClaim:
            claimName: dayz-profile-pvc
        - name: dayz-server-cfg
          configMap:
            name: dayz-server-cfg
            items:
            - key: serverDZ.cfg
              path: serverDZ.cfg
        - name: dayz-beserver-cfg
          configMap:
            name: dayz-beserver-cfg
            items:
            - key: BEServer_x64.cfg
              path: BEServer_x64.cfg
        - name: filebrowser-config
          persistentVolumeClaim:
            claimName: filebrowser-config-pvc
      containers:
        - name: dayz
          image: razorbladex401/dayz:latest
          imagePullPolicy: Always
          volumeMounts:
          - mountPath: "/home/steam/dayz"
            name: dayz-data
          - mountPath: "/home/steam/profile"
            name: dayz-profile
          - name: dayz-server-cfg
            mountPath: "/home/steam/serverDZ.cfg"
            subPath: serverDZ.cfg
          - name: dayz-beserver-cfg
            mountPath: "/home/steam/battleye/BEServer_x64.cfg"
            subPath: BEServer_x64.cfg
          env:
            - name: GAME
              value: dayz
            - name: HOME
              value: /home/steam
            - name: APPID
              value: "223350"
            - name: TZ
              value: "America/New_York"
            - name: STEAMACCOUNT
              valueFrom:
                secretKeyRef:
                  name: steamaccount
                  key: STEAMACCOUNT
            - name: STEAMPASSWORD
              valueFrom:
                secretKeyRef:
                  name: steamaccount
                  key: STEAMPASSWORD
            - name: CPUCOUNT
              value: "4"
            - name: PORT
              value: "2302"
          ports:
            - name: rcon
              containerPort: 2310
            - name: steam-27016
              containerPort: 27016
            - name: steam-8766
              containerPort: 8766
            - name: game-2305
              containerPort: 2305
            - name: game-2304
              containerPort: 2304
            - name: game-2303
              containerPort: 2303
            - name: game-2302
              containerPort: 2302
        - name: filebrowser
          image: filebrowser/filebrowser:latest
          imagePullPolicy: Always
          command:
            - /bin/sh
            - -ec
            - |
              exec filebrowser \
                --address 0.0.0.0 \
                --port 8080 \
                --root /srv \
                --database /config/filebrowser.db \
                --noauth
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
          volumeMounts:
          - mountPath: /srv/dayz
            name: dayz-data
          - mountPath: /srv/profile
            name: dayz-profile
          - mountPath: /config
            name: filebrowser-config
          ports:
            - name: filebrowser
              containerPort: 8080

